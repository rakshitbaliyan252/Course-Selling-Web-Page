<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Development Course Charges</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    header {
      background-color: #0078d7;
      color: white;
      padding: 20px 0;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .pricing-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .pricing-table th, .pricing-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .pricing-table th {
      background-color: #f1f1f1;
    }
    .button {
      display: block;
      width: 200px;
      margin: 20px auto;
      padding: 10px;
      text-align: center;
      background-color: #0078d7;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Website Development Course Charges</h1>
  </header>
  <div class="container">
    <h2>Our Pricing Plans</h2>
    <p>Choose a plan that fits your learning needs:</p>
    <table class="pricing-table">
      <thead>
        <tr>
          <th>Plan</th>
          <th>Duration</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Beginner</td>
          <td>1 Month</td>
          <td>$99</td>
        </tr>
        <tr>
          <td>Intermediate</td>
          <td>3 Months</td>
          <td>$249</td>
        </tr>
        <tr>
          <td>Advanced</td>
          <td>6 Months</td>
          <td>$499</td>
        </tr>
      </tbody>
    </table>
    <a href="contact.html" class="button">Enroll Now</a>
  </div>
</body>
</html>
